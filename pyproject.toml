[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synergy-blockchain-budget"
version = "0.3.0"
description = "Cryptographically verifiable public federal-budget traceability ledger for SINERGY"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "SINERGY / SHTENCO"}]
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1,<4", "xlrd>=2.0.1,<3"]
dev = ["pytest>=8.0", "openpyxl>=3.1,<4", "xlrd>=2.0.1,<3"]

[project.scripts]
synergy-budget = "synergy_budget.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
